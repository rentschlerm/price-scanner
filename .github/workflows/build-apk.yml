name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'app/src/main/assets/index.html'
      - 'apps-script/**'
      - 'README.md'
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download barcode and spreadsheet libraries
        run: |
          curl -fsSL https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js -o app/src/main/assets/zxing.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js -o app/src/main/assets/xlsx.full.min.js
          cp apps-script/Code.gs app/src/main/assets/Code.gs

      - name: Build APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk PriceScanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PriceScanner
          path: PriceScanner.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Price Scanner v1.0.${{ github.run_number }}
          body: |
            Download **PriceScanner.apk** below and open it on your Android phone to install.
          files: PriceScanner.apk
          make_latest: true
