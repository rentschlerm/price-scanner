plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rentschler.pricescanner'
    compileSdk 34

    defaultConfig {
        applicationId "com.rentschler.pricescanner"
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("BUILD_NUMBER") ?: "1")
        versionName "1.0." + (System.getenv("BUILD_NUMBER") ?: "1")
    }

    signingConfigs {
        release {
            storeFile file("pricescanner.keystore")
            storePassword "pricescanner"
            keyAlias "pricescanner"
            keyPassword "pricescanner"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
