plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rentschler.pricescanner'
    compileSdk 34

    defaultConfig {
        applicationId "com.rentschler.pricescanner"
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("BUILD_NUMBER") ?: "1")
        versionName "1.0." + (System.getenv("BUILD_NUMBER") ?: "1")
    }

    signingConfigs {
        release {
            storeFile file("pricescanner.keystore")
            storePassword "pricescanner"
            keyAlias "pricescanner"
            keyPassword "pricescanner"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
